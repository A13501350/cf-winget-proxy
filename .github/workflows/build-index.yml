name: Build winget index

# Rebuild the full package index daily and on demand, from the same feed winget's
# own default source uses (see scripts/build-index.sh). index.json is committed
# back to the default branch and the Worker reads it at runtime from INDEX_URL,
# so the new index goes live without a redeploy.
#
# The commit carries [skip ci] for two reasons: this workflow must not trigger
# itself again, and Cloudflare Workers Builds honours the same marker — without
# it every daily index push would build and ship a new Worker version.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build index
        run: bash scripts/build-index.sh

      # build-index.sh already refuses to emit a malformed table; this asks the
      # stronger question — does the fresh index still answer real queries and
      # still carry the name/moniker/tag columns search reads? A rebuild that
      # silently drops coverage makes live queries come back empty, and only a
      # hit-rate check notices. Needs plain node, which the runner ships.
      - name: Verify search hit rate
        run: node test_index_search.mjs

      - name: Commit index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json unchanged"
          else
            git commit -m "chore: update winget index [skip ci]"
            git push
          fi
