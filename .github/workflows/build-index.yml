name: Build winget index

# Rebuild the full package index daily and on demand. The resulting index.json
# is committed back to the default branch; Cloudflare Workers Builds is
# configured to watch only `src/**` (and wrangler.toml), so this push does NOT
# trigger a Worker redeploy.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test index path parser
        run: bash scripts/test-index-parser.sh

      - name: Build index
        run: bash scripts/build-index.sh

      # build-index.sh already refuses to emit a malformed table; this asks the
      # stronger question — does the fresh index still answer real queries
      # locally? A rebuild that silently drops coverage is what pushes live
      # traffic back onto the rate-limited Contents API, and only a hit-rate
      # check notices. Needs plain node, which the runner ships.
      - name: Verify search hit rate
        run: node test_index_search.mjs

      - name: Commit index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json unchanged"
          else
            git commit -m "chore: update winget index [skip ci]"
            git push
          fi
