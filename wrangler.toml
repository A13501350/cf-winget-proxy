name = "cf-winget-proxy"
main = "src/index.ts"
compatibility_date = "2024-07-25"

[vars]
# Mirror used for GitHub-hosted installers. Must accept the path form:
#   <MIRROR>/https://github.com/owner/repo/...
# Installers are downloaded by the client directly from here (not via the worker).
MIRROR = "https://gh-proxy.org"
# For higher GitHub API rate limits (search / version listing), set a token:
#   wrangler secret put GITHUB_TOKEN
# (do NOT put the token here in plaintext; use the secret store above)

[[cache_namespaces]]
binding = "WINGET_CACHE"
# Edge cache for the worker's outbound GitHub requests (directory listings,
# version enumerations, manifest YAML). Cuts GitHub API rate-limit pressure.
