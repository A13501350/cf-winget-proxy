#:schema ./node_modules/wrangler/config-schema.json

name = "cf-winget-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-29"

[vars]
# Mirror used for GitHub-hosted installers. Must accept the path form:
#   <MIRROR>/https://github.com/owner/repo/...
# Installers are downloaded by the client directly from here (not via the worker).
MIRROR = "https://gh-proxy.org"
# Prebuilt full package index (id + latest version + name/moniker/tags), generated
# by the build-index GitHub Action from the official source feed and committed
# back to this repo. Enables complete keyword search without per-query GitHub
# API calls.
#
# Any URL works as long as Cloudflare can fetch it and it is not a
# *.workers.dev host — a Worker fetching a workers.dev URL is a cyclic
# subrequest and fails closed (an empty index means every search returns nothing).
# If your fork does not keep Actions → workflows enabled, index.json goes stale
# silently; npm run build:index regenerates it by hand.
INDEX_URL = "https://raw.githubusercontent.com/A13501350/cf-winget-proxy/main/index.json"
# NOTE: nothing reads GITHUB_TOKEN any more (the api.github.com path is deleted);
# do not create one for this Worker.


[cache]
enabled = true